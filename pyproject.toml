[project]
name = "quntatradeai"
version = "0.1.0"
description = "Claude-powered multi-venue AI trading agent for crypto and forex."
authors = [
    {name = "QuntaTradeAI",email = "godlovesconrad@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "hyperliquid-python-sdk (>=0.20.0,<0.21.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "web3 (>=7.14.0,<8.0.0)",
    "aiohttp (>=3.13.1,<4.0.0)",
    "anthropic (>=0.52.0,<1.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "ccxt (>=4.4.0,<5.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn (>=0.32.0,<1.0.0)",
    "cryptography (>=43.0.0,<45.0.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "sentry-sdk (>=2.58.0,<3.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)"
]

[project.optional-dependencies]
oanda      = ["oandapyV20 (>=0.7.2,<0.8.0)"]
metatrader = ["metaapi-cloud-sdk (>=28.0.0,<32.0.0)"]
alpaca     = ["alpaca-py (>=0.34.0,<1.0.0)"]
ibkr       = ["ib-insync (>=0.9.86,<1.0.0)"]
polymarket = ["py-clob-client (>=0.20.0,<1.0.0)"]
all-venues = [
    "oandapyV20 (>=0.7.2,<0.8.0)",
    "metaapi-cloud-sdk (>=28.0.0,<32.0.0)",
    "alpaca-py (>=0.34.0,<1.0.0)",
    "ib-insync (>=0.9.86,<1.0.0)",
    "py-clob-client (>=0.20.0,<1.0.0)",
]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<1.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[project.scripts]
qunta = "src.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
