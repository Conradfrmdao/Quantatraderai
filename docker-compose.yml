services:
  api:
    build: .
    image: quantatraderai-api
    container_name: quantatraderai-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    # Resource caps so a runaway loop can't OOM the host
    mem_limit: 1500m
    mem_reservation: 512m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
