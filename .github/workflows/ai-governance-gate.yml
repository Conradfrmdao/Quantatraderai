name: ai-governance-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          POETRY_VIRTUALENVS_IN_PROJECT=true poetry install --extras dev --no-root

      - name: Install UI deps
        working-directory: ui
        run: npm install

      - name: Python AI governance tests
        run: poetry run pytest tests/test_ai_governance.py tests/test_ai_streaming.py tests/test_ai_isolation.py tests/test_ai_observability.py tests/test_server_integration.py tests/test_council.py -q

      - name: Python forex trust gate
        run: poetry run pytest tests/test_forex_oanda.py tests/test_forex_metatrader.py tests/test_forex_utils.py -q

      - name: Python crypto trust gate
        run: poetry run pytest tests/test_crypto_binance.py tests/test_crypto_ccxt.py tests/test_crypto_hyperliquid.py -q

      - name: Python market-data and failure gate
        run: poetry run pytest tests/test_market_data_freshness.py tests/test_failure_modes.py tests/test_venue_flows.py -q

      - name: Python release load gate
        run: poetry run pytest tests/test_load.py -q

      - name: UI tests
        working-directory: ui
        run: npm test -- --run

      - name: UI typecheck
        working-directory: ui
        run: npx tsc --noEmit
